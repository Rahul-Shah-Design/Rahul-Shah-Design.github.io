<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ocean:#DCEBF2; --ocean-line:#B9D3E0;
  --ink:#16324A; --ink-soft:#4A6275;
  --paper:#FFFFFF; --land:#FFFFFF; --land-out:#EAEFF2; --border:#8FA7B8;
  --target:#F3D98B; --right:#B9D9A6; --wrong:#EFB7B2;
  --red:#C8323C; --ok:#2F7D4F;
  --line:#16324A1f;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ocean:#0F2536; --ocean-line:#1C3A50; --ink:#E6EEF3; --ink-soft:#9DB3C2;
    --paper:#17324A; --land:#2A4A62; --land-out:#1B3346; --border:#0F2536;
    --target:#C9A94E; --right:#5E9A4E; --wrong:#B0605A; --red:#FF6B6B; --ok:#6BCB8B; --line:#E6EEF31f;
  }
}
:root[data-theme="dark"]{
  --ocean:#0F2536; --ocean-line:#1C3A50; --ink:#E6EEF3; --ink-soft:#9DB3C2;
  --paper:#17324A; --land:#2A4A62; --land-out:#1B3346; --border:#0F2536;
  --target:#C9A94E; --right:#5E9A4E; --wrong:#B0605A; --red:#FF6B6B; --ok:#6BCB8B; --line:#E6EEF31f;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ocean);color:var(--ink);font:17px/1.5 var(--body)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:640px;margin:0 auto;padding:12px 16px 0}
#setup,#results{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
#play{padding-bottom:max(0px,calc(env(safe-area-inset-bottom,0px) - 16px))}
h1{font:800 40px/1 var(--display);letter-spacing:-.03em;margin:18px 0 6px}
h2{font:600 18px/1.2 var(--display);margin:26px 0 10px}
p{margin:0 0 12px;max-width:62ch}
.muted{color:var(--ink-soft)}
.small{font-size:14px}

/* Setup */
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font:600 18px/1.2 var(--display);margin:26px 0 10px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:block;padding:8px 14px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:15px}
.chip input:checked+span{background:var(--ink);color:var(--ocean);border-color:var(--ink)}
.chip input:focus-visible+span{outline:3px solid var(--red);outline-offset:2px}
.games{display:grid;gap:8px}
.game{position:relative;display:block}
.game input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.game .box{display:grid;grid-template-columns:1fr;gap:2px;padding:14px 16px;border-radius:14px;background:var(--paper);border:2px solid transparent}
.game b{font:600 18px/1.2 var(--display)}
.game small{color:var(--ink-soft);font-size:15px}
.game input:checked+.box{border-color:var(--ink)}
.game input:focus-visible+.box{outline:3px solid var(--red);outline-offset:2px}
.primary{display:block;width:100%;border:0;border-radius:14px;padding:16px 18px;background:var(--ink);color:var(--ocean);font-weight:700;font-size:18px}
.ghost{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px}
.start{margin-top:28px}

/* Play */
.play{display:flex;flex-direction:column;gap:10px}
.qhead{display:flex;align-items:center;gap:10px;padding-top:4px}
.progress{flex:1;height:8px;border-radius:4px;background:var(--paper);overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
.map{position:relative;height:clamp(260px,50vh,520px);border-radius:18px;overflow:hidden;border:1px solid var(--ocean-line);background:var(--ocean);touch-action:none}
.map svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.zoomctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:18px;line-height:1}
.sea{fill:var(--ocean)}
.bg{fill:var(--land-out);stroke:var(--border);stroke-width:.5;vector-effect:non-scaling-stroke}
.c{fill:var(--land);stroke:var(--border);stroke-width:.6;vector-effect:non-scaling-stroke}
.c.out{fill:var(--land-out)}
.c.target{fill:var(--target);stroke:var(--red);stroke-width:1.6}
.c.right{fill:var(--right);stroke:var(--ok);stroke-width:1.6}
.c.wrong{fill:var(--wrong);stroke:var(--red);stroke-width:1.6}
.mk{fill:none;stroke:var(--ink-soft);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.7;pointer-events:none}
.mk.out{opacity:.25}
.mk.target{fill:var(--target);stroke:var(--red);stroke-width:2.5;opacity:1}
.mk.right{fill:var(--right);stroke:var(--ok);stroke-width:2.5;opacity:1}
.mk.wrong{fill:var(--wrong);stroke:var(--red);stroke-width:2.5;opacity:1}
.hit{fill:transparent}
.mode-find .c:not(.out),.mode-find .hit:not(.out){cursor:pointer}
.lbl{font-family:var(--body);font-weight:700;fill:var(--ink);stroke:var(--ocean);paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.lbl.wrong{fill:var(--red)}
@keyframes pulse{0%,100%{stroke-width:1.6}50%{stroke-width:5}}
.c.target,.mk.target{animation:pulse 1.4s ease-in-out 2}

.panel{background:var(--paper);border-radius:18px;padding:16px}
.prompt{font:600 24px/1.2 var(--display);letter-spacing:-.01em;margin:0 0 12px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.answers button{border:1px solid var(--line);background:var(--ocean);border-radius:12px;padding:12px 10px;min-height:56px;font-size:16px;line-height:1.25}
.answers button.right{background:var(--right);border-color:var(--ok);color:#16324A}
.answers button.wrong{background:var(--wrong);border-color:var(--red);color:#16324A}
.answers button:disabled{cursor:default}
.typebox{display:flex;gap:8px}
.typebox input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--ocean);font-size:18px}
.qline{display:flex;align-items:flex-start;gap:12px;margin:0 0 12px}
.qline .prompt{flex:1;margin:0}
.skip{flex:none;margin-top:1px;padding:6px 12px;font-size:15px}
.next{width:fit-content;margin:12px 0 0 auto;padding:12px 22px}
.feedback{margin:12px 0 0;font-size:16px}
.feedback:empty{margin:0}
.feedback.good{color:var(--ok);font-weight:700}
.feedback.bad{border-left:4px solid var(--red);padding-left:10px}

/* Results */
.big{font:800 64px/1 var(--display);letter-spacing:-.04em;margin:8px 0 2px}
.missed{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
.missed li{padding:5px 12px;border-radius:999px;background:var(--wrong);color:#16324A;font-size:15px}
.stack{display:grid;gap:8px;margin-top:24px}
.err{padding:14px;border-radius:12px;background:var(--paper);border-left:4px solid var(--red)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:700px){.map{height:min(58vh,560px)}}
</style>
</head>
<body>
<div class="app">

<section id="setup" aria-labelledby="t1">
  <h1 id="t1">Atlas Run</h1>
  <p class="muted">Learn where every country is. Misses come back later in the round until you get them.</p>
  <fieldset><legend>Where</legend><div class="chips" id="scopes"></div></fieldset>
  <fieldset><legend>Game</legend><div class="games" id="modes"></div></fieldset>
  <fieldset><legend>Round length</legend><div class="chips" id="lens"></div></fieldset>
  <button class="primary start" id="startBtn">Start</button>
</section>

<section id="play" class="play" hidden aria-label="Game">
  <div class="qhead">
    <button class="ghost small" id="quitBtn">Quit</button>
    <div class="progress" role="progressbar" aria-label="Round progress" aria-valuemin="0" aria-valuemax="100"><span id="bar"></span></div>
    <span class="small muted" id="count"></span>
  </div>
  <div class="map" id="map">
    <div class="zoomctl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Reset view">⤢</button></div>
  </div>
  <div class="panel">
    <div class="qline">
      <p class="prompt" id="prompt" tabindex="-1"></p>
      <button class="ghost skip" id="skipBtn">I don't know</button>
    </div>
    <div id="answer"></div>
    <p class="feedback" id="fb" aria-live="polite"></p>
    <button class="primary next" id="nextBtn" hidden>Next</button>
  </div>
</section>

<section id="results" hidden aria-labelledby="t3">
  <h1 id="t3">Round done</h1>
  <p class="big" id="score"></p>
  <p class="muted" id="scoreNote"></p>
  <div id="missWrap"><h2>Keep practicing</h2><ul class="missed" id="missed"></ul></div>
  <div class="stack">
    <button class="primary" id="replayMiss">Replay the ones I missed</button>
    <button class="ghost" id="again">Play again</button>
    <button class="ghost" id="newGame">Change game</button>
  </div>
</section>

</div>

  pac:false, scope:null, k:1, cw:0, ch:0, labels:[],
  init(){
    if(!window.d3){ $("map").insertAdjacentHTML("afterbegin",'<p class="err">The map library failed to load. Check your connection and reload.</p>'); return; }
    this.svg = d3.select("#map").insert("svg",":first-child").attr("aria-hidden","true");
    this.g = this.svg.append("g");
    this.zoom = d3.zoom().scaleExtent([0.1,400]).on("zoom", e=>this.onZoom(e.transform));
    this.svg.call(this.zoom).on("dblclick.zoom", null);
    this.svg.on("click", e=>{
      const t = e.target.closest("[data-i]"); if(!t) return;
      const c = C[+t.dataset.i]; if(!c || !this.inScope(c)) return;
      this.onTap && this.onTap(c);
    });
    $("zin").onclick = ()=>this.svg.transition().duration(reduced?0:250).call(this.zoom.scaleBy,1.8);
    $("zout").onclick = ()=>this.svg.transition().duration(reduced?0:250).call(this.zoom.scaleBy,1/1.8);
    $("zfit").onclick = ()=>this.fit(this.scopeBox());
    new ResizeObserver(()=>{ if(!$("play").hidden){ this.size(); } }).observe($("map"));
  },
  geo(c){ return this.pac ? {d:c.pd,b:c.pb,c:c.pc} : {d:c.d,b:c.b,c:c.c}; },
  inScope(c){ return this.scope==="world" || c.r===this.scope; },
  build(scope){
    if(!this.svg) return;
    this.scope = scope; this.pac = scope==="oceania";
    const P = this.pac;
    let h = `<path class="sea" d="${P?MD.sphere2:MD.sphere}"/><path class="bg" d="${P?MD.bg.pd:MD.bg.d}"/>`;
    for(const c of C){ const g=this.geo(c); if(g.d) h += `<path class="c${this.inScope(c)?"":" out"}" id="p${c.i}" data-i="${c.i}" d="${g.d}"/>`; }
    for(const c of C){ const g=this.geo(c); if(c.s && g.c){ const o=this.inScope(c)?"":" out";
      h += `<circle class="mk${o}" id="m${c.i}" cx="${g.c[0]}" cy="${g.c[1]}" r="5"/><circle class="hit${o}" data-i="${c.i}" cx="${g.c[0]}" cy="${g.c[1]}" r="14"/>`; } }
    h += `<g id="lbls"></g>`;
    this.g.html(h);
    this.size(); this.fit(this.scopeBox(), true);
  },
  size(){
    const r = $("map").getBoundingClientRect(); this.cw = r.width; this.ch = r.height;
    this.svg.attr("width",this.cw).attr("height",this.ch);
  },
  scopeBox(){
    if(this.scope==="world") return [[0,0],[MD.W,MD.H]];
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const c of C){ if(c.r!==this.scope || c.n==="Russia") continue; const b=this.geo(c).b; if(!b) continue;
      x0=Math.min(x0,b[0][0]); y0=Math.min(y0,b[0][1]); x1=Math.max(x1,b[1][0]); y1=Math.max(y1,b[1][1]); }
    return [[x0,y0],[x1,y1]];
  },
  union(...bs){ return [[Math.min(...bs.map(b=>b[0][0])),Math.min(...bs.map(b=>b[0][1]))],[Math.max(...bs.map(b=>b[1][0])),Math.max(...bs.map(b=>b[1][1]))]]; },
  context(b, min=70){ // grow a box so the country is shown with neighbors
    const cx=(b[0][0]+b[1][0])/2, cy=(b[0][1]+b[1][1])/2;
    const w=Math.max((b[1][0]-b[0][0])*2.4,min), h=Math.max((b[1][1]-b[0][1])*2.4,min*0.6);
    return [[cx-w/2,cy-h/2],[cx+w/2,cy+h/2]];
  },
  fit(b, instant){
    if(!this.svg) return;
    const w=b[1][0]-b[0][0], h=b[1][1]-b[0][1], cx=(b[0][0]+b[1][0])/2, cy=(b[0][1]+b[1][1])/2;
    const k = Math.min(this.cw/w, this.ch/h)*0.92;
    const t = d3.zoomIdentity.translate(this.cw/2-k*cx, this.ch/2-k*cy).scale(k);
    (instant||reduced ? this.svg : this.svg.transition().duration(650)).call(this.zoom.transform, t);
  },
  onZoom(t){
    this.g.attr("transform", t); this.k = t.k;
    this.g.selectAll("circle.mk").attr("r", 5/t.k);
    this.g.selectAll("circle.hit").attr("r", 14/t.k);
    this.g.selectAll("text.lbl").attr("font-size", 14/t.k).attr("stroke-width", 4/t.k);
  },
  mark(c, cls){
    const p=$("p"+c.i), m=$("m"+c.i);
    [p,m].forEach(el=>{ if(el){ el.classList.remove("target","right","wrong"); if(cls) el.classList.add(cls); }});
    if(cls && p) p.parentNode.insertBefore(p, p.parentNode.querySelector("circle, #lbls")); // raise stroke above neighbors
  },
  label(c, cls){
    const g=this.geo(c); if(!g.c) return;
    const k=this.k, dy = c.s ? -9/k : 0;
    d3.select("#lbls").append("text").attr("class","lbl "+(cls||"")).attr("x",g.c[0]).attr("y",g.c[1]+dy)
      .attr("text-anchor","middle").attr("dominant-baseline", c.s?"auto":"middle")
      .attr("font-size",14/k).attr("stroke-width",4/k).text(c.n);
  },
  reset(){ C.forEach(c=>this.mark(c,null)); d3.select("#lbls").html(""); },
  // Grow the map into any empty screen below the panel. iOS scrolls a focused input as far as the
  // page allows, so empty space under the text box is where the keyboard scrolls the map away to.
  fill(on){
    const m = $("map"); m.style.height = "";
    if(on){ const spare = innerHeight - ($("play").getBoundingClientRect().bottom + scrollY);
      if(spare > 0) m.style.height = (m.offsetHeight + spare) + "px"; }
    if(this.svg) this.size();
  }
};

/* ---------- Name matching for Type it ---------- */
const ALT = {"United States":["usa","us","america","united states of america"],"United Kingdom":["uk","britain","great britain"],
 "Czechia":["czech republic"],"Côte d'Ivoire":["ivory coast"],"Myanmar":["burma"],"Timor-Leste":["east timor"],"Eswatini":["swaziland"],
 "North Macedonia":["macedonia"],"Vatican City":["vatican","holy see"],"Republic of the Congo":["congo","congo brazzaville","republic of congo"],
 "DR Congo":["drc","democratic republic of the congo","democratic republic of congo","congo kinshasa"],"United Arab Emirates":["uae","emirates"],
 "Cabo Verde":["cape verde"],"Turkey":["turkiye"],"Micronesia":["federated states of micronesia"],"Bosnia and Herzegovina":["bosnia"],
 "Trinidad and Tobago":["trinidad"],"Antigua and Barbuda":["antigua"],"Saint Kitts and Nevis":["saint kitts"],"São Tomé and Príncipe":["sao tome"],
 "South Korea":["korea","republic of korea"],"North Korea":["dprk"],"Netherlands":["holland"],"Laos":["lao"],"Russia":["russian federation"],
 "Vietnam":["viet nam"],"Central African Republic":["car"],"Saint Vincent and the Grenadines":["saint vincent","st vincent"]};
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/&/g," and ")
  .replace(/\bst\.?\s/g,"saint ").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim().replace(/^the /,"");
const NAMES = C.flatMap(c=>[c.n,...(ALT[c.n]||[])].map(x=>({c, s:norm(x)})));
function lev(a,b){ const m=a.length,n=b.length; let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const q=[i]; for(let j=1;j<=n;j++) q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=q; } return p[n]; }
const tol = s => s.length<=5 ? 0 : s.length<=9 ? 1 : 2;
function judge(input, target){
  const s = norm(input); if(!s) return {ok:false};
  let best=null;
  for(const x of NAMES){ const d=lev(s,x.s); if(d<=tol(x.s) && (!best || d<best.d || (d===best.d && x.c===target))) best={c:x.c,d}; }
  if(best && best.c===target) return {ok:true, exact: best.d===0};
  return {ok:false, other: best ? best.c : null};
}

/* ---------- Game ---------- */
const G = {
  start(scope, mode, len, only){
    const pool = only ? only.slice() : C.filter(c=>scope==="world"||c.r===scope);
    let list = shuffle(pool.slice()); if(len!=="all" && !only) list = list.slice(0, +len);
    this.scope=scope; this.mode=mode; this.len=len;
    this.queue = list.map(c=>({c,tries:0})); this.total = list.length;
    this.done = 0; this.firstTry = 0; this.missed = new Set();
    show("play"); MapV.build(scope); this.next();
  },
  next(){
    clearTimeout(this.t);
    if(!this.queue.length) return this.finish();
    this.q = this.queue.shift(); this.answered = false;
    const m = this.mode==="mixed" ? ["pick","find","type"][Math.random()*3|0] : this.mode;
    this.qm = m;
    $("map").className = "map mode-"+m;
    MapV.reset(); MapV.onTap = null;
    $("fb").textContent = ""; $("fb").className = "feedback";
    $("nextBtn").hidden = true; $("skipBtn").hidden = false;
    $("count").textContent = `${this.done}/${this.total}`;
    $("bar").style.width = (this.done/this.total*100)+"%";
    const c = this.q.c, geo = MapV.geo(c);
    let box;
    if(m==="find"){
      $("prompt").textContent = `Find ${c.n}`;
      $("answer").innerHTML = `<p class="small muted" style="margin:0">Tap it on the map. Pinch or use + to zoom.${c.s?" Small countries have a circle.":""}</p>`;
      box = MapV.scopeBox();
      MapV.onTap = t => this.answer(t===c, t);
    } else {
      MapV.mark(c,"target"); box = MapV.context(geo.b);
      if(m==="pick"){
        $("prompt").textContent = "Which country is this?";
        const opts = shuffle([c, ...this.distractors(c)]);
        $("answer").innerHTML = `<div class="answers">${opts.map(o=>`<button data-n="${esc(o.n)}">${esc(o.n)}</button>`).join("")}</div>`;
        $("answer").querySelectorAll("button").forEach(b=>b.onclick=()=>{
          const pick = byName[b.dataset.n]; this.answer(pick===c, pick, b);
        });
      } else {
        $("prompt").textContent = "Name this country";
        $("answer").innerHTML = `<form class="typebox" id="tf" autocomplete="off"><input id="ti" aria-label="Country name" placeholder="Type a name" autocapitalize="words" spellcheck="false"><button class="ghost">Check</button></form>`;
        $("tf").onsubmit = e=>{ e.preventDefault(); if(this.answered) return;
          const v=$("ti").value; if(!v.trim()) return; const r=judge(v,c); this.answer(r.ok, r.other, null, r, v); };
        setTimeout(()=>$("ti") && $("ti").focus({preventScroll:true}), 50);
      }
    }
    MapV.fill(m==="type" && touch); MapV.fit(box);
  },
  distractors(c){
    const pool = C.filter(o=>o!==c && (this.scope==="world"||o.r===this.scope) && MapV.geo(o).c);
    const cc = MapV.geo(c).c;
    pool.sort((a,b)=>{ const A=MapV.geo(a).c,B=MapV.geo(b).c; return Math.hypot(A[0]-cc[0],A[1]-cc[1])-Math.hypot(B[0]-cc[0],B[1]-cc[1]); });
    return shuffle(pool.slice(0,6)).slice(0,3);
  },
  answer(ok, other, btn, typed, raw){
    if(this.answered) return; this.answered = true;
    const c = this.q.c; MapV.onTap = null;
    $("skipBtn").hidden = true;
    $("answer").querySelectorAll("button,input").forEach(el=>el.disabled=true);
    if(ok){
      if(this.q.tries===0 && !this.missed.has(c)) this.firstTry++;
      this.done++;
      MapV.mark(c,"right"); MapV.label(c);
      if(btn) btn.classList.add("right");
      $("fb").className = "feedback good";
      $("fb").textContent = typed && !typed.exact ? `Yes, ${c.n}. Watch the spelling.` : `Yes, ${c.n}.`;
      $("nextBtn").hidden = false;
      this.t = setTimeout(()=>this.next(), typed && !typed.exact ? 1800 : 1000);
    } else {
      this.missed.add(c); this.q.tries++;
      if(this.q.tries<=2) this.queue.splice(Math.min(3,this.queue.length),0,this.q); else this.done++;
      MapV.mark(c,"right"); MapV.label(c);
      let msg;
      if(this.qm==="pick" && btn){
        $("answer").querySelectorAll("button").forEach(b=>{ if(b.dataset.n===c.n) b.classList.add("right"); });
        btn.classList.add("wrong");
      }
      if(other && other!==c){
        MapV.mark(other,"wrong"); MapV.label(other,"wrong");
        const og=MapV.geo(other), cg=MapV.geo(c);
        if(og.b) MapV.fit(MapV.context(MapV.union(og.b,cg.b),50));
        msg = this.qm==="find" ? `You tapped ${other.n}. ${c.n} is the green one.`
            : this.qm==="type" ? `${other.n} is a different country. This one is ${c.n}.`
            : `That's ${c.n}. ${other.n} is shown in red.`;
      } else {
        MapV.fit(MapV.context(MapV.geo(c).b));
        msg = `This is ${c.n}.`;
      }
      $("fb").className = "feedback bad";
      $("fb").textContent = msg + (this.q.tries<=2 ? " It'll come back soon." : "");
      $("nextBtn").hidden = false; $("nextBtn").focus({preventScroll:true});
    }
    $("count").textContent = `${this.done}/${this.total}`;
    $("bar").style.width = (this.done/this.total*100)+"%";
  },
  skip(){ if(!this.answered) this.answer(false, null); },
  finish(){
    show("results");
    $("score").textContent = `${this.firstTry}/${this.total}`;
    $("scoreNote").textContent = this.firstTry===this.total ? "Every one right on the first try." : "right on the first try";
    const miss=[...this.missed];
    $("missWrap").hidden = !miss.length; $("replayMiss").hidden = !miss.length;
    $("missed").innerHTML = miss.map(c=>`<li>${esc(c.n)}</li>`).join("");
    this.lastMiss = miss;
  }
};

$("startBtn").onclick = ()=>G.start(cfg.scope, cfg.mode, cfg.len);
$("nextBtn").onclick = ()=>G.next();
$("skipBtn").onclick = ()=>G.skip();
$("quitBtn").onclick = ()=>{ clearTimeout(G.t); show("setup"); };
$("replayMiss").onclick = ()=>G.start(G.scope, G.mode, "all", G.lastMiss);
$("again").onclick = ()=>G.start(cfg.scope, cfg.mode, cfg.len);
$("newGame").onclick = ()=>show("setup");
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && !$("nextBtn").hidden && document.activeElement.id!=="ti"){ e.preventDefault(); G.next(); } });
MapV.init();
})();
</script>
